# PottyPlay Cinema LAN Edge Caching Micro-Server
# Reverse-proxy and caching engine for in-auditorium & restroom companion streaming.

worker_processes auto;
events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance tuning for high-throughput video streaming on theater LAN
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Cache storage: 20 GB local disk cache for video segments
    proxy_cache_path /var/cache/nginx/pottyplay_media
                     levels=1:2
                     keys_zone=media_cache:50m
                     max_size=20g
                     inactive=7d
                     use_temp_path=off;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        # Health probe endpoint for client discovery and failover testing
        location /health {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            return 200 '{"status":"ok","service":"pottyplay-edge-cache","timestamp":"$time_iso8601"}';
        }

        # Media cache and upstream proxy location
        location / {
            # CORS headers to support HTML5 Video and WebGL canvas capture
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range, Authorization, Content-Type' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # Cache configuration
            proxy_cache media_cache;
            proxy_cache_key $uri$is_args$args;
            proxy_cache_valid 200 206 7d;
            proxy_cache_valid 301 302 1h;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            # Upstream streaming proxy settings
            proxy_pass_request_headers on;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Support HTTP byte range requests for scrubbing and seeking
            proxy_force_ranges on;

            # Telemetry header: HIT, MISS, or BYPASS
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-PottyPlay-Edge "LAN-MICRONODE" always;

            # Upstream fallback if not routed directly to local media assets
            # Default upstream points to cloud storage CDN
            proxy_pass https://commondatastorage.googleapis.com;
        }
    }
}
