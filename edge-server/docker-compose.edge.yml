version: '3.8'

services:
  pottyplay-edge-cache:
    image: nginx:alpine
    container_name: pottyplay-edge-cache
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - pottyplay_edge_cache_data:/var/cache/nginx/pottyplay_media
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pottyplay_edge_cache_data:
    driver: local
