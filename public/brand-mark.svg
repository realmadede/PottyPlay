<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Screen to Companion Gradient: Theatrical Heather to Amber -->
    <linearGradient id="ppPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A5A8E" />
      <stop offset="100%" stop-color="#F5C451" />
    </linearGradient>
    <linearGradient id="ppDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1F22" />
      <stop offset="100%" stop-color="#121517" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7A5A8E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Badge with Smooth Curved Contours -->
  <rect width="512" height="512" rx="128" fill="url(#ppDarkGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(230, 234, 232, 0.14)" stroke-width="4" />

  <!-- Theater Curved Arc (Top authoritative sweep) -->
  <path d="M 112 188 C 196 140 316 140 400 188" 
        fill="none" 
        stroke="#E6EAE8" 
        stroke-opacity="0.16" 
        stroke-width="24" 
        stroke-linecap="round" />

  <!-- Continuous Dual-Loop Cinema Companion Bridge -->
  <g filter="url(#subtleGlow)">
    <!-- Main Continuous Ribbon -->
    <path d="M 148 308 C 112 252 136 180 204 164 C 272 148 344 196 364 256 C 376 292 360 336 324 352 C 284 370 236 354 212 320" 
          fill="none" 
          stroke="url(#ppPrimaryGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Forward Transition Vector (Continuous stream continuity) -->
    <path d="M 236 216 L 300 256 L 236 296 Z" 
          fill="#121517" 
          stroke="url(#ppPrimaryGrad)" 
          stroke-width="10" 
          stroke-linejoin="round" />
  </g>

  <!-- Live Synchronization Pulse Dot -->
  <circle cx="396" cy="188" r="14" fill="#F5C451" />
  <circle cx="396" cy="188" r="24" fill="none" stroke="#F5C451" stroke-width="4" opacity="0.5" />
</svg>
