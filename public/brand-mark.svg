<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Screen to Companion Gradient -->
    <linearGradient id="ppPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="ppDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232323" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FFB800" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Badge with Smooth Curved Contours -->
  <rect width="512" height="512" rx="128" fill="url(#ppDarkGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#2D2D2D" stroke-width="4" />

  <!-- Theater Curved Arc (Top authoritative sweep) -->
  <path d="M 112 188 C 196 140 316 140 400 188" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-opacity="0.12" 
        stroke-width="24" 
        stroke-linecap="round" />

  <!-- Continuous Dual-Loop Cinema Companion Bridge -->
  <!-- Upper loop represents theater projection; lower loop represents companion receiver -->
  <g filter="url(#subtleGlow)">
    <!-- Main Continuous Ribbon -->
    <path d="M 148 308 C 112 252 136 180 204 164 C 272 148 344 196 364 256 C 376 292 360 336 324 352 C 284 370 236 354 212 320" 
          fill="none" 
          stroke="url(#ppPrimaryGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Forward Transition Vector (Continuous stream continuity) -->
    <path d="M 236 216 L 300 256 L 236 296 Z" 
          fill="#171717" 
          stroke="url(#ppPrimaryGrad)" 
          stroke-width="10" 
          stroke-linejoin="round" />
  </g>

  <!-- Live Synchronization Pulse Dot -->
  <circle cx="396" cy="188" r="14" fill="#FFB800" />
  <circle cx="396" cy="188" r="24" fill="none" stroke="#FFB800" stroke-width="4" opacity="0.5" />
</svg>
